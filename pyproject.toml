[project]
name = "uav-visual-localization"
version = "0.1.0"
description = "Prototype HTTP service for UAV visual localization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "Pillow>=10.4.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
